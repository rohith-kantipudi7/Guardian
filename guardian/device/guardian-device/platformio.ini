; Guardian device firmware (ESP32, Arduino framework)
;
;   pio run -e esp32dev            -> all hardware mocked, Wi-Fi stands in for cellular
;   pio run -e esp32dev-hw         -> MPU6050 + NMEA GNSS + SIMCOM LTE + ELM327 OBD-II
;   pio test -e native             -> crash engine + event queue unit tests on the host

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Iinclude -Isrc

[esp32_base]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.2.0
    mikalhart/TinyGPSPlus@^1.1.0
    vshymanskyy/TinyGSM@^0.12.0
    arduino-libraries/ArduinoHttpClient@^0.6.1
    plerup/EspSoftwareSerial@^8.2.0

[env:esp32dev]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -DGUARDIAN_IMU_MPU6050=0
    -DGUARDIAN_GNSS_NMEA=0
    -DGUARDIAN_CELLULAR_SIMCOM=0
    -DGUARDIAN_VEHICLE_OBD=0
    -DGUARDIAN_BATTERY_ADC=0

[env:esp32dev-hw]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -DGUARDIAN_IMU_MPU6050=1
    -DGUARDIAN_GNSS_NMEA=1
    -DGUARDIAN_CELLULAR_SIMCOM=1
    -DGUARDIAN_VEHICLE_OBD=1
    -DGUARDIAN_BATTERY_ADC=1
    -DTINY_GSM_MODEM_SIM7600

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<crash/> +<storage/event_queue.cpp> +<sim/>
